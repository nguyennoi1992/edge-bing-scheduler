  <script type="module">
    import {
      assert,
      assertEqual,
      collectActionableRewardCards,
      findDialogClaimButton,
      findReadyToClaimCard,
      finishBrowserTest,
      isCardCompleted,
    } from "./reward-browser-test-helpers.js";

    await finishBrowserTest("dashboard live HTML card scanning", async () => {
      const eventsCard = document.querySelector("[data-testid='card-events']");
      assert(eventsCard !== null, "events card should exist");
      assert(!isCardCompleted(eventsCard), "events card initially not completed");

      const daily = collectActionableRewardCards(document.getElementById("dailyset")).cards;
      const dailyIds = daily.map((card) => card.dataset.testid);

      assertEqual(daily.length, 3, "dashboard should find all 3 daily-set cards in live HTML");
      assert(dailyIds.includes("card-events"), "events card should be actionable");
      assert(dailyIds.includes("card-chicago"), "chicago card should be actionable");
      assert(dailyIds.includes("card-borobudur"), "borobudur card should be actionable");

      // Verify completion detection via modern Tailwind direct SVG class (text-statusSuccessTintFg)
      const badgePill = eventsCard.querySelector(".bg-statusInformativeTintBg");
      assert(badgePill !== null, "events card should contain informative badge pill");
      const savedHtml = badgePill.outerHTML;
      try {
        badgePill.outerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="size-5 shrink-0 text-statusSuccessTintFg"><path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"></path></svg>';
        assert(isCardCompleted(eventsCard), "events card should be detected as completed via direct SVG text-statusSuccessTintFg");

        const dailyAfter = collectActionableRewardCards(document.getElementById("dailyset")).cards;
        assertEqual(dailyAfter.length, 2, "completed card should be excluded from actionable cards");
        assert(!dailyAfter.map((c) => c.dataset.testid).includes("card-events"), "completed events card should be excluded");
      } finally {
        const svgEl = eventsCard.querySelector("svg.text-statusSuccessTintFg");
        if (svgEl) svgEl.outerHTML = savedHtml;
      }

      // Verify ready-to-claim detection
      const ready = findReadyToClaimCard(document);
      assert(ready !== null, "ready-to-claim card should be found");
      assertEqual(ready.points, 6, "contains 6 points");

      // Verify claim-points flyout button detection
      const claimBtn = findDialogClaimButton(document);
      assert(claimBtn !== null, "claim points button should be found inside flyout");
      assertEqual(claimBtn.id, "react-aria7315260451-_r_7_", "matches claim points button id");

      // Verify collapsed section expansion via expandRewardSection
      const dailysetSec = document.getElementById("dailyset");
      const triggerBtn = dailysetSec.querySelector("[slot='trigger']");
      const panelEl = dailysetSec.querySelector(".react-aria-DisclosurePanel");
      assert(triggerBtn !== null && panelEl !== null, "trigger and panel should exist");

      // Simulate collapsed state
      triggerBtn.setAttribute("aria-expanded", "false");
      panelEl.setAttribute("aria-hidden", "true");
      panelEl.style.display = "none";
      triggerBtn.addEventListener("click", () => {
        triggerBtn.setAttribute("aria-expanded", "true");
        panelEl.setAttribute("aria-hidden", "false");
        panelEl.style.display = "";
      });

      assert(typeof globalThis.expandRewardSection === "function", "expandRewardSection helper should be defined");
      globalThis.expandRewardSection(dailysetSec);

      assertEqual(triggerBtn.getAttribute("aria-expanded"), "true", "trigger should be marked expanded");
      assertEqual(panelEl.getAttribute("aria-hidden"), "false", "panel should be marked not hidden");
      assert(panelEl.style.display !== "none", "panel display:none should be removed");

      const dailyAfterExpand = collectActionableRewardCards(dailysetSec).cards;
      assertEqual(dailyAfterExpand.length, 3, "all 3 daily-set cards should be actionable after expandRewardSection");

      // Test injectRestoredDailySet and ensurePersistentDailySet
      assert(typeof globalThis.injectRestoredDailySet === "function", "injectRestoredDailySet should exist");
      assert(typeof globalThis.ensurePersistentDailySet === "function", "ensurePersistentDailySet should exist");

      // Remove existing #dailyset to test restoration
      dailysetSec.remove();
      assert(document.getElementById("dailyset") === null, "dailyset should be removed");

      // Inject restored daily set
      const mockData = {
        streakDays: 132,
        cards: [
          { name: "C1", title: "Test 1", description: "Desc 1", points: 10, complete: false, destinationUrl: "https://www.bing.com/search?q=1", imageUrl: "" },
          { name: "C2", title: "Test 2", description: "Desc 2", points: 10, complete: true, destinationUrl: "https://www.bing.com/search?q=2", imageUrl: "" }
        ]
      };
      globalThis.ensurePersistentDailySet(mockData);

      const restored = document.getElementById("dailyset");
      assert(restored !== null, "dailyset should be restored");
      assertEqual(restored.querySelectorAll("a[href]").length, 2, "2 cards should be rendered");
      assert(restored.innerText.includes("132 day streak"), "streak flame badge should be present");

      // Test React hydration removal & auto-recovery via MutationObserver
      restored.remove();
      assert(document.getElementById("dailyset") === null, "dailyset temporarily removed");

      await new Promise((resolve) => setTimeout(resolve, 50));
      const recovered = document.getElementById("dailyset");
      assert(recovered !== null, "dailyset should be automatically re-mounted by MutationObserver");
      assertEqual(recovered.querySelectorAll("a[href]").length, 2, "recovered dailyset should contain 2 cards");
    });
  </script>
